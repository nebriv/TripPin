name: CI

# Tests and linting on every push and pull request; a green run on main is
# what deploys the site. The deploy job below is gated on `checks`, so a red
# tree cannot reach Cloudflare.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and linting
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The game has no build step and no bundler: src/*.js is served as
      # written. A syntax error therefore ships a blank page, and nothing
      # else in this repo would catch it.
      - name: Syntax-check every tracked JS file
        run: |
          fail=0
          for f in $(git ls-files '*.js' '*.mjs'); do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::JavaScript syntax error"
              fail=1
            fi
          done
          exit $fail

      - name: Byte-compile the Python tools
        run: python -m py_compile $(git ls-files 'tools/*.py')

      # Deliberately the "this is actually broken" rule set — syntax errors,
      # undefined names, bad comparisons. The tools are stdlib-only scripts;
      # style rules are not worth a red tree here.
      - name: Lint the Python tools
        run: |
          pip install ruff==0.15.10
          ruff check --select E9,F63,F7,F82 tools/

      - name: Deal ledger — no repeats, no skips, minimum gap held
        run: node tools/sim/cycle.js

      - name: Share grids — host rounds stay indistinguishable
        run: node tools/sim/share.js

      # src/stays.js is the private deck and is not in this repo. These two
      # steps run only where it is present, so a full checkout gets the extra
      # coverage and the public repo stays green without it.
      - name: Fact generator runs over the real deck
        run: |
          if [ -f src/stays.js ]; then
            node tools/sim/facts-check.mjs
          else
            echo "src/stays.js is not in this repo - skipping."
          fi

      - name: Build the single-file site
        run: |
          if [ -f src/stays.js ]; then
            python tools/build_single.py
          else
            echo "src/stays.js is not in this repo - dist/ is checked in."
          fi

      # The words must not be in the repo at all. Set ENTRY_KEY and
      # ADMIN_KEY as repository secrets to arm this; without them the step is
      # a no-op, so forks and outside pull requests still pass. Matches are
      # reported by filename only, and Actions masks the values in logs.
      - name: No secret word in the tree or the built pages
        env:
          ENTRY_KEY: ${{ secrets.ENTRY_KEY }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys

          words = {n: os.environ.get(n, '').strip()
                   for n in ('ENTRY_KEY', 'ADMIN_KEY')}
          words = {n: w for n, w in words.items() if w}
          if not words:
              print('Neither ENTRY_KEY nor ADMIN_KEY is set as a repository '
                    'secret - nothing to check against.')
              sys.exit(0)

          tracked = subprocess.run(['git', 'ls-files'], text=True,
                                   capture_output=True, check=True).stdout.split()
          built = [str(p) for p in sorted(pathlib.Path('dist').glob('*.html'))]

          bad = False
          for path in dict.fromkeys(tracked + built):
              try:
                  body = pathlib.Path(path).read_text(encoding='utf-8',
                                                      errors='replace')
              except OSError:
                  continue
              for name, word in words.items():
                  if word in body:
                      print(f'::error file={path}::{name} appears in this file')
                      bad = True

          if bad:
              sys.exit(1)
          print(f'Checked {len(tracked)} tracked files and {len(built)} built '
                f'pages for {len(words)} secret(s): none present.')
          PY

  deploy:
    name: Deploy to Cloudflare
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Several checkouts of this repo share one Worker. Queue deploys rather
    # than racing them, and never cancel one midway.
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install wrangler
        run: npm ci
        working-directory: worker

      # build_single.py needs the deck, which is not in this repo, so dist/
      # is deployed as committed. Rebuild it locally and commit it when you
      # change anything under src/. A checkout that does have src/stays.js
      # rebuilds here instead.
      - name: Rebuild dist/ when the deck is present
        run: |
          if [ -f src/stays.js ]; then
            python tools/build_single.py
          else
            echo "src/stays.js is not in this repo - deploying dist/ as committed."
          fi

      # ENTRY_KEY and ADMIN_KEY are Worker secrets already set with
      # `wrangler secret put`. They persist across deploys and are not
      # needed here.
      - name: Deploy
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
